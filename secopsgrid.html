<title>SecOpsGrid</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sc24 reference: wide navy side menu with solid-blue active item, yellow brand subtitle; title row with primary button; icon-tile stat cards; area + donut charts; pill badges. Single dark look by design. */
:root{
  --bg:#0C1527; --side:#0A1222; --panel:#121D33; --raised:#182640; --sunk:#0E182C; --line:#1F2D4A; --line-soft:#19263F;
  --fg:#F2F5FA; --muted:#94A2BB; --faint:#5F6E89;
  --accent:#3D8BFF; --accent-btn:#1D63F0; --cyan:#1FD0F5; --brand-grad:linear-gradient(90deg,#1E74FF 0%,#1FD0F5 100%); --accent-ink:#FFFFFF; --accent-soft:rgba(74,125,247,.15);
  --gold:#F5C518; --gold-ink:#1A1405; --gold-soft:rgba(245,197,24,.13);
  --crit:#EF5350; --high:#F5C518; --med:#4A7DF7; --low:#8C9CB7; --ok:#34D399; --wait:#F5A623; --orange:#FB8C3C;
  --crit-soft:rgba(239,83,80,.13); --high-soft:rgba(245,197,24,.12); --med-soft:rgba(74,125,247,.14); --low-soft:rgba(140,156,183,.13);
  --ok-soft:rgba(52,211,153,.12); --wait-soft:rgba(245,166,35,.13); --orange-soft:rgba(251,140,60,.13);
  --scrim:rgba(3,7,15,.65); --shadow:0 24px 70px rgba(0,0,0,.55);
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:14px;overflow-y:auto;
  padding-block:22px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;background:var(--side);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:0 4px 18px}
.brand b{display:block;font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.brand .grid{background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-logo{flex:none;width:48px;height:48px;display:block}
.brand small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.02em;color:#B9C7DD;margin-top:3px;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:10px;color:#C3CDDD;text-decoration:none;font-size:15px;font-weight:500;transition:background .15s,color .15s}
.nav a svg{color:var(--muted);flex:none}
.nav a:hover{background:var(--raised);color:var(--fg)}
.nav a[aria-current="page"]{background:linear-gradient(90deg,#1D63F0,#1C7FF2);color:#fff;font-weight:600}
.nav a[aria-current="page"] svg{color:#fff}
.nav .badge{margin-left:auto}
.nav a[aria-current="page"] .badge{background:rgba(255,255,255,.2);color:#fff}
.badge{font-family:var(--f-mono);font-size:11.5px;font-weight:700;min-width:22px;text-align:center;padding:1px 7px;border-radius:999px;background:var(--gold);color:var(--gold-ink)}
.admin-box{display:flex;align-items:center;gap:12px;padding:13px 16px;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#0D1729;color:var(--gold);font-weight:700;text-decoration:none}
.admin-box:hover{border-color:#2D3E62}
.admin-box[aria-current="page"]{border-color:var(--gold)}
.admin-badge{margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#F87171;background:rgba(239,83,80,.14);border:1px solid rgba(239,83,80,.5);padding:1px 9px;border-radius:999px}
.me-card{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px}
.me-card .who{min-width:0;flex:1}
.me-card b{display:block;font-size:14.5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-card small{display:block;color:var(--muted);font-size:12px}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:26px 6px;padding-left:36px;padding-right:max(36px,env(safe-area-inset-right,0px))}
.top h1{font-size:30px;font-weight:800;letter-spacing:-.01em;margin-right:auto}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.updated{color:var(--muted);font-size:14px;margin-right:6px}
.search{display:flex;align-items:center;gap:8px;width:250px;max-width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--fg)}
.search kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.roleswitch{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 12px;border:1px dashed #2B3B5C;border-radius:10px}
.roleswitch span{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.seg{display:flex;background:var(--sunk);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:600;transition:border-color .15s,background .15s,filter .15s;white-space:nowrap}
.btn:hover{border-color:#34466D}
.btn.primary{background:var(--accent-btn);border-color:var(--accent-btn);color:#fff;font-weight:700}
.btn.primary:hover{filter:brightness(1.12)}
.btn.good{color:var(--ok);border-color:rgba(52,211,153,.4);background:var(--ok-soft)}
.btn.good:hover{background:rgba(52,211,153,.2)}
.btn.bad{color:#F87171;border-color:rgba(239,83,80,.45);background:var(--crit-soft)}
.btn.bad:hover{background:rgba(239,83,80,.22)}
.btn.sm{padding:6px 12px;font-size:13.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.icon-btn{width:42px;height:42px;padding:0;position:relative}
.icon-btn.sm{width:34px;height:34px}
.icon-btn .dotn{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--crit);border:2px solid var(--panel)}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:0;text-decoration:none}
.link:hover{text-decoration:underline}

.view{padding-block:22px 60px;padding-left:36px;padding-right:max(36px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h2{font-size:18px;font-weight:700;color:var(--fg)}
h3{font-size:22px;font-weight:700;line-height:1.25}
.sub{color:var(--muted);margin:0;max-width:80ch}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:24px;align-items:start}
.stack{display:grid;gap:24px;min-width:0}
.hint{font-size:13px;color:var(--faint);margin:0}
.empty{color:var(--faint);font-size:14px;text-align:center;padding:22px 12px;border:1px dashed var(--line);border-radius:10px}

/* ---- stat cards ---- */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;display:flex;align-items:center;gap:18px;text-align:left;min-width:0}
button.tile:hover{border-color:#34466D}
.tile .ti{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;flex:none}
.ti.blue{background:rgba(74,125,247,.16);color:#5B8BFF}.ti.red{background:rgba(239,83,80,.16);color:#F25F5C}.ti.gold{background:rgba(245,197,24,.14);color:var(--gold)}.ti.green{background:rgba(52,211,153,.13);color:var(--ok)}
.tile .tx{display:grid;gap:2px;min-width:0}
.tile .lbl{font-size:15px;color:var(--muted)}
.tile .val{font-family:var(--f-display);font-size:32px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .note{font-size:12.5px;color:var(--faint)}
.tile.wait .val{color:var(--gold)} .tile.late .val{color:#F25F5C} .tile.block .val{color:var(--orange)}

/* ---- charts ---- */
.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block;width:100%;min-width:520px;height:auto}
.donut-box{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap;padding:8px 0}
.donut-box svg{width:220px;max-width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.legend.vert{flex-direction:column;gap:12px;font-size:14.5px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:13px;height:13px;border-radius:50%;display:inline-block}

/* ---- pills ---- */
.pri{font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 10px;border-radius:999px;white-space:nowrap;border:1px solid}
.pri.crit{color:#F87171;background:var(--crit-soft);border-color:rgba(239,83,80,.5)}
.pri.high{color:var(--gold);background:var(--high-soft);border-color:rgba(245,197,24,.45)}
.pri.med{color:#7FA5FF;background:var(--med-soft);border-color:rgba(74,125,247,.5)}
.pri.low{color:var(--low);background:var(--low-soft);border-color:rgba(140,156,183,.4)}
.st{font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.wait{color:var(--wait)} .st.pool{color:#7FA5FF} .st.prog{color:var(--accent)} .st.block{color:var(--orange)} .st.done{color:var(--ok)} .st.rej{color:#F87171}
.tag{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);background:var(--sunk);border:1px solid var(--line);padding:1px 7px;border-radius:6px;white-space:nowrap}
.tag.team{color:var(--gold);border-color:rgba(245,197,24,.3);background:var(--gold-soft)}
.kind{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.due{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.due.soon{color:var(--wait)} .due.late{color:#F87171;font-weight:700}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;background:var(--raised);border:1px solid var(--line);flex:none;color:var(--fg)}
.av.lg{width:44px;height:44px;font-size:15px}
.av.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:800}
.av.team{border-radius:7px;color:var(--gold);font-family:var(--f-mono);font-size:9.5px;width:auto;padding:0 6px}
.role-chip{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);font-weight:700}

/* ---- rows & tables ---- */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 6px;border:0;border-top:1px solid var(--line-soft);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
button.row:hover{background:var(--raised)}
.stripe{width:4px;align-self:stretch;border-radius:2px;min-height:32px}
.p-crit{background:var(--crit)}.p-high{background:var(--high)}.p-med{background:var(--med)}.p-low{background:var(--low)}
.row-main{min-width:0;display:grid;gap:4px}
.row-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.row-side{display:flex;gap:10px;align-items:center}
.id{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{font-weight:500;color:var(--muted);text-align:left;font-size:14px;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 14px;border-bottom:1px solid var(--line-soft);font-variant-numeric:tabular-nums;vertical-align:middle}
tbody tr:hover td{background:rgba(255,255,255,.015)}
td.num,th.num{text-align:right}
td .t-title{font-weight:600;max-width:420px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lock{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--faint)}

/* ---- approvals ---- */
.appr{display:grid;gap:14px;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.panel .appr{background:var(--sunk)}
.appr-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.appr-title{font-weight:700;font-size:16px;background:none;border:0;padding:0;text-align:left;color:var(--fg)}
button.appr-title:hover{color:var(--accent)}
.appr-why{font-size:14px;color:var(--muted);margin:0}
.appr-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.group{display:grid;gap:12px}
.group-head{display:flex;align-items:center;gap:10px}
.chain{display:flex;align-items:center;flex-wrap:wrap;row-gap:10px;padding:12px 14px;border-radius:10px;background:rgba(10,18,34,.6);border:1px solid var(--line-soft)}
.step{display:flex;align-items:center;gap:9px;font-size:13px}
.step .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px solid var(--line);color:var(--faint)}
.step.ok .ic{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.step.wait .ic{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.step.no .ic{border-color:var(--crit);color:var(--crit);background:var(--crit-soft)}
.step b{font-weight:700;display:block;line-height:1.2}
.step small{color:var(--muted);display:block;font-size:12px;line-height:1.25}
.step-line{width:30px;height:2px;background:var(--line);margin:0 10px;border-radius:1px}
.step-line.ok{background:var(--ok)}

/* ---- board ---- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 14px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--gold)}
.tabs .badge{margin-left:7px;background:var(--raised);color:var(--muted)}
.tabs button[aria-selected="true"] .badge{background:var(--gold);color:var(--gold-ink)}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13.5px;color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{color:#fff;border-color:var(--accent-btn);background:var(--accent-btn)}
select.chip{padding-right:8px}
.board-wrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(5,minmax(250px,1fr));gap:16px;min-width:1300px}
.col{background:var(--sunk);border:1px solid var(--line-soft);border-radius:14px;display:flex;flex-direction:column;min-height:340px}
.col-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.col-head b{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.col-head i{width:9px;height:9px;border-radius:50%;display:inline-block}
.col-head span{font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.col-body{padding:0 10px 10px;display:flex;flex-direction:column;gap:10px;flex:1}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px 12px 16px;display:grid;gap:9px;text-align:left;width:100%;transition:border-color .15s,transform .15s}
.card:hover{border-color:#34466D;transform:translateY(-1px)}
.card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--pc)}
.card.crit{--pc:var(--crit)}.card.high{--pc:var(--high)}.card.med{--pc:var(--med)}.card.low{--pc:var(--low)}
.card.dragging{opacity:.45}
.card-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.card-title{font-weight:600;line-height:1.35}
.card .blockr{font-size:12.5px;color:var(--orange);background:var(--orange-soft);padding:5px 8px;border-radius:7px}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.rejected{border:1px solid rgba(239,83,80,.35);background:rgba(239,83,80,.06);border-radius:14px;padding:16px 18px;display:grid;gap:12px}
.rej-item{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.rej-item .grow{flex:1 1 260px;min-width:0}

/* ---- drawer & modal ---- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);z-index:21;background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-head{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--side)}
.drawer-body{overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:22px}
.drawer h2{font-size:15px}
.sec{display:grid;gap:10px}
.meta{display:grid;grid-template-columns:140px minmax(0,1fr);gap:11px 14px;font-size:14px;align-items:center;margin:0;padding:16px;border:1px solid var(--line-soft);border-radius:12px;background:var(--sunk)}
.meta dt{color:var(--muted)}
.meta dd{margin:0;min-width:0;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.banner{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:10px;font-size:14px;border:1px solid}
.banner.block{background:var(--orange-soft);border-color:rgba(251,140,60,.35)} .banner.block svg{color:var(--orange);flex:none}
.banner.wait{background:var(--gold-soft);border-color:rgba(245,197,24,.35)} .banner.wait svg{color:var(--gold);flex:none}
.banner.rej{background:var(--crit-soft);border-color:rgba(239,83,80,.35)} .banner.rej svg{color:var(--crit);flex:none}
.banner.info{background:var(--accent-soft);border-color:rgba(74,125,247,.35)} .banner.info svg{color:var(--accent);flex:none}
.checks{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:7px 9px;border-radius:7px;cursor:pointer}
.checks label:hover{background:var(--raised)}
.checks input{accent-color:var(--accent-btn);margin-top:4px}
.checks input:checked + span{color:var(--muted);text-decoration:line-through}
.files{display:grid;gap:7px}
.file{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:var(--sunk)}
.file .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comments{display:grid;gap:12px}
.cmt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;font-size:14px}
.cmt b{font-weight:700;margin-right:6px}
.timeline{margin:0 0 0 6px;padding:0;list-style:none;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 12px 18px;font-size:13.5px;color:var(--muted)}
.timeline li::before{content:"";position:absolute;left:-5px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.timeline time{font-family:var(--f-mono);font-size:12px;color:var(--faint);margin-right:8px}
.modal-wrap{position:fixed;inset:0;z-index:31;display:grid;place-items:center;padding:16px}
.modal{width:min(560px,100%);max-height:calc(100vh - 32px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:24px;display:grid;gap:18px}
.form{display:grid;gap:15px}
.field{display:grid;gap:6px}
.field label,.field .lab{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea,.inline-in{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk)}
.field input:focus,.field select:focus,.field textarea:focus,.inline-in:focus{border-color:var(--accent);outline:none}
.field textarea{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.flow-preview{border:1px dashed #2B3B5C;border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--sunk)}
.flow-preview p{margin:0;font-size:14px;color:var(--muted)}
.reasons{display:flex;gap:6px;flex-wrap:wrap}

/* ---- events ---- */
.ev{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 4px;border-top:1px solid var(--line-soft)}
.ev:first-child{border-top:0}
.stack .ev{grid-template-columns:62px minmax(0,1fr)}
.stack .ev > :last-child{grid-column:2}
.cal{border:1px solid var(--line);border-radius:10px;text-align:center;overflow:hidden;background:var(--sunk)}
.cal small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--accent-btn);color:#fff;padding:2px 0}
.cal b{display:block;font-size:22px;font-weight:800;padding:3px 0}
.ev-type{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:800}
.ev-type.int{color:var(--accent)} .ev-type.ext{color:var(--ok)} .ev-type.spk{color:var(--gold)}
.cert{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line-soft);align-items:center}
.cert:first-child{border-top:0}
.ann{padding:14px 0;border-top:1px solid var(--line-soft);display:grid;gap:5px}
.ann:first-child{border-top:0}
.ann b{font-weight:700}

/* ---- reports ---- */
.filters-bar{display:flex;gap:14px;flex-wrap:wrap;align-items:end;padding:16px 20px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.filters-bar .field{min-width:170px}
.bars{display:grid;gap:14px}
.bar-row{display:grid;grid-template-columns:120px minmax(0,1fr) 100px;gap:14px;align-items:center;font-size:13.5px}
.bar-track{display:grid;gap:4px}
.bar{height:10px;border-radius:5px;background:var(--accent)}
.bar.b2{background:var(--low)} .bar.b3{background:var(--gold)} .bar.b4{background:var(--wait)}
.stacked{display:flex;height:13px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.stacked i{display:block;height:100%}
.axis{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-left:134px;margin-right:114px}

/* ---- org ---- */
.unit{display:grid;gap:12px}
.team-row{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
.team-row .members{display:flex;gap:5px;flex-wrap:wrap}
.warn-chip{font-size:12px;font-weight:600;color:var(--gold);background:var(--gold-soft);border:1px solid rgba(245,197,24,.35);padding:2px 9px;border-radius:999px;white-space:nowrap}

/* ---- integration ---- */
pre.code{margin:0;padding:14px 16px;border-radius:10px;background:var(--side);border:1px solid var(--line);font-family:var(--f-mono);font-size:13px;overflow-x:auto;line-height:1.6;color:#C9D6EA}
.ep{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line-soft);font-size:14px}
.ep:first-child{border-top:0}
.method{font-family:var(--f-mono);font-size:11.5px;font-weight:700;padding:2px 6px;border-radius:6px;text-align:center;border:1px solid}
.method.get{color:var(--ok);background:var(--ok-soft);border-color:rgba(52,211,153,.35)} .method.post{color:#7FA5FF;background:var(--med-soft);border-color:rgba(74,125,247,.4)}
.ep code{font-family:var(--f-mono);font-size:13px;word-break:break-all}
.tool{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line-soft);font-size:14px;flex-wrap:wrap}
.tool:first-child{border-top:0}
.tool code{font-family:var(--f-mono);font-weight:600;color:var(--gold)}

/* ---- notifications ---- */
.notif{display:grid;grid-template-columns:8px minmax(0,1fr);gap:12px;padding:12px 4px;border-top:1px solid var(--line-soft);font-size:14px;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.notif:first-child{border-top:0}
.notif:hover{background:var(--raised)}
.notif .nd{width:8px;height:8px;border-radius:50%;margin-top:7px;background:transparent}
.notif.unread .nd{background:var(--gold)}
.notif time{font-family:var(--f-mono);font-size:12px;color:var(--faint);display:block}
.prefs td{padding:8px 10px}
.prefs input{accent-color:var(--accent-btn);width:17px;height:17px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--raised);border:1px solid #34466D;color:var(--fg);padding:11px 16px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px);display:flex;gap:10px;align-items:center}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none}

@media (max-width:1250px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
  .brand{padding:0 6px;width:100%}
  .nav{flex-direction:row;flex-wrap:wrap;gap:4px}
  .nav a{padding:8px 11px;font-size:14px}
  .admin-box{margin-top:0;padding:8px 12px}
  .me-card{display:none}
  .top,.view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top h1{font-size:25px;width:100%}
  .updated{display:none}
  .search{width:100%}
  .row-title{white-space:normal}
  .row{grid-template-columns:4px minmax(0,1fr)}
  .row-side{grid-column:2}
  .row2{grid-template-columns:1fr}
  .meta{grid-template-columns:110px minmax(0,1fr)}
  .bar-row{grid-template-columns:86px minmax(0,1fr) 78px}
  .axis{margin-left:100px;margin-right:92px}
  .team-row{grid-template-columns:minmax(0,1fr)}
  .ev{grid-template-columns:54px minmax(0,1fr)}
  .ev > :last-child{grid-column:2}
  .panel{padding:18px}
  .tile{padding:18px}
}
@media (max-width:500px){.tiles{grid-template-columns:minmax(0,1fr)}.roleswitch{width:100%;justify-content:space-between}.seg button{padding:6px 7px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function teamHeadOf(teamId){const t=TEAMS[teamId];return t.head||UNITS[t.unit].head}
function unitOf(id){const p=P(id);return p.unit||(p.team?TEAMS[p.team].unit:null)}
function respMgr(id){const p=P(id);if(p.role==='dir')return null;if(p.role==='uh')return'HA';if(p.role==='th')return UNITS[unitOf(id)].head;return teamHeadOf(p.team)}
function isManagerOf(m,id){if(!id||m===id)return false;if(P(m).role==='dir')return true;if(respMgr(id)===m)return true;const u=unitOf(id);return P(m).role==='uh'&&P(m).unit===u}
function managedTeams(id){const p=P(id);if(p.role==='dir')return Object.keys(TEAMS);if(p.role==='uh')return Object.keys(TEAMS).filter(k=>TEAMS[k].unit===p.unit);if(p.role==='th')return Object.keys(TEAMS).filter(k=>TEAMS[k].head===id);return[]}
function teamOfPerson(id){const p=P(id);return p.team||null}
function membersOf(teamId){return Object.keys(PEOPLE).filter(k=>PEOPLE[k].team===teamId)}
const asgUser=t=>t.asg.t==='user'?t.asg.id:null;
const isMgrRole=id=>['th','uh','dir'].includes(P(id).role);

function flowFor(req,target){
 if(target.t==='team'){const h=teamHeadOf(target.id);const noTH=!TEAMS[target.id].head;
  return{status:'Ekip Havuzu',steps:[{who:h,label:noTH?'Ekipte Team Head yok, Unit Head delege eder':'Ekip yöneticisi delege eder'}],
   text:P(req).role==='dir'?`Direktör ataması: task doğrudan ${target.id} havuzuna düşer, ${nm(h)} bir çalışana delege eder.`:`Task ${target.id} havuzuna düşer. ${nm(h)} kabul edip bir çalışana delege eder.`}}
 const u=target.id;
 if(u===req)return{status:'Yapılacak',steps:[],auto:'Kendine atadı, otomatik kabul',text:'Kendinize atıyorsunuz. Onay gerekmez, task hemen “Yapılacak” olur.'};
 if(P(req).role==='dir')return{status:'Yapılacak',steps:[],auto:'Direktörden geldi, direkt kabul',text:'Direktör ataması onaysız olarak doğrudan kişiye düşer.'};
 if(isManagerOf(req,u))return{status:'Yapılacak',steps:[],auto:'Yöneticisinden geldi, direkt kabul',text:`${nm(u)} sizin ekibinizde. Task onaysız olarak doğrudan ona düşer.`};
 if(isMgrRole(req)&&isMgrRole(u))return{status:'Kabul Bekliyor',steps:[{who:u,label:'Yöneticiden yöneticiye, karşı taraf kabulü'}],text:`Yöneticiden yöneticiye atama: ${nm(u)} kabul veya ret verir.`};
 const sameTeam=teamOfPerson(req)&&(teamOfPerson(req)===teamOfPerson(u)||respMgr(req)===u);
 if(sameTeam)return{status:'Kabul Bekliyor',steps:[{who:u,label:respMgr(req)===u?'Çalışandan yöneticisine, kabul gerekir':'Ekip arkadaşından geldi'}],text:`Aynı ekip içi atama: ${nm(u)} kabul veya ret verir.`};
 const m=respMgr(u);
 return{status:'Kabul Bekliyor',steps:[{who:u,label:'Çalışan kabulü'},{who:m,label:'Yönetici kabulü'}],text:`Başka ekipten atama: önce ${nm(u)}, ardından yöneticisi ${nm(m)} kabul eder.`};
}

/* Görünürlük (Q9) */
function related(t){const r=[t.req];if(asgUser(t))r.push(asgUser(t));t.chain.forEach(s=>s.state!=='todo'&&r.push(s.who));return r}
function canSee(t,id=me()){
 const p=P(id); if(p.role==='dir')return true;
 const rel=related(t);
 if(rel.includes(id))return true;
 const tTeam=t.asg.t==='team'?t.asg.id:t.team0;
 if(p.role==='emp')return tTeam===p.team && t.status!=='Kabul Bekliyor';
 const mt=managedTeams(id);
 if(tTeam&&mt.includes(tTeam))return true;
 if(t.status==='Kabul Bekliyor'){const pending=t.chain.filter(s=>s.state==='wait').map(s=>s.who);return pending.some(w=>isManagerOf(id,w))||isManagerOf(id,asgUser(t))||isManagerOf(id,t.req)}
 return rel.some(r=>{const tm=teamOfPerson(r);return tm&&mt.includes(tm)||isManagerOf(id,r)});
}
function canChangeStatus(t,id=me()){
 if(P(id).role==='dir')return true;
 const a=asgUser(t); if(!a)return false;
 return a===id||isManagerOf(id,a);
}
function pendingStepFor(t,id=me()){return t.chain.find(s=>s.state==='wait'&&s.who===id&&['Kabul Bekliyor','Ekip Havuzu'].includes(t.status))}

function toast(msg){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
function notify(id,txt,task){if(!notifs[id])return;notifs[id].unshift({t:now(),txt,task,unread:true})}
function log(t,txt){t.audit.push([now(),txt])}
function matchesQ(t){if(!q)return true;const h=[t.id,t.title,asgName(t),nm(t.req),t.ref,t.tags.join(' '),t.team0||''].join(' ').toLocaleLowerCase('tr');return h.includes(q)}
const visibleTasks=()=>tasks.filter(t=>canSee(t));
function approvalsFor(id=me()){
 const items=[];
 tasks.forEach(t=>{const s=pendingStepFor(t,id);if(s)items.push({type:t.status==='Ekip Havuzu'?'pool':'task',t,s})});
 events.forEach(e=>{if(e.approver===id&&e.status==='wait')items.push({type:'event',e})});
 if(P(id).role==='emp'||true)events.forEach(e=>{if(e.kind==='int'&&e.rsvp&&id in e.rsvp&&e.rsvp[id]===null)items.push({type:'rsvp',e})});
 if(isMgrRole(id))tasks.forEach(t=>{if(canSee(t,id)&&t.due!=null&&t.due<0&&!['Tamamlandı','İptal','Reddedildi'].includes(t.status)&&asgUser(t)!==id)items.push({type:'esc',t})});
 return items;
}

function smoothPath(pts,base){let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
 const c1=[p1[0]+(p2[0]-p0[0])/6,Math.min(base,p1[1]+(p2[1]-p0[1])/6)],c2=[p2[0]-(p3[0]-p1[0])/6,Math.min(base,p2[1]-(p3[1]-p1[1])/6)];
 d+=` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}return d}
function areaChart(opened,closed,labels){
 const W=880,H=330,L=46,R=52,T=18,B=40,iw=W-L-R,ih=H-T-B;
 const mx=Math.max(...opened,...closed), step=mx>40?20:mx>20?10:5, top=Math.ceil(mx/step)*step||step;
 const x=i=>L+i*(iw/(labels.length-1)), y=v=>T+ih-(v/top)*ih, base=T+ih;
 const po=opened.map((v,i)=>[x(i),y(v)]), pc=closed.map((v,i)=>[x(i),y(v)]);
 const ticks=[];for(let v=0;v<=top;v+=step)ticks.push(v);
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Son 7 günde açılan ve kapanan task sayıları">
  ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#1F2D4A" stroke-width="1"/><text x="${L-10}" y="${y(v)+4}" text-anchor="end" fill="#94A2BB" font-size="13">${v}</text>`).join('')}
  ${labels.map((l,i)=>`<text x="${x(i)}" y="${H-12}" text-anchor="middle" fill="#94A2BB" font-size="14">${l}</text>`).join('')}
  <path d="${smoothPath(po,base)} L${x(labels.length-1)},${base} L${L},${base} Z" fill="rgba(29,79,215,.28)"/>
  <path d="${smoothPath(po,base)}" fill="none" stroke="#2F5FE0" stroke-width="2.5"/>
  <path d="${smoothPath(pc,base)}" fill="none" stroke="#34D399" stroke-width="2" stroke-dasharray="6 5"/>
  ${pc.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#34D399"/>`).join('')}
  ${po.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#F5C518" stroke="#121D33" stroke-width="2"><title>${labels[i]}: ${opened[i]} açılan, ${closed[i]} kapanan</title></circle>`).join('')}
 </svg>`;
}
function donut(parts){

}

function requestStatus(t,st){

const RF={'7':.25,'30':1,'90':2.9};

 <div class="drawer-body"><div>${list.map((n,i)=>`<button class="notif ${n.unread?'unread':''}" data-notif="${i}"><span class="nd"></span><span><time>${esc(n.t)}</time>${esc(n.txt)}</span></button>`).join('')||'<div class="empty">Bildirim yok.</div>'}</div>
 <section class="sec"><h2>Bildirim tercihleri</h2><div class="tbl-wrap"><table class="prefs"><thead><tr><th>Olay</th><th class="num">Uygulama içi</th><th class="num">E-posta</th></tr></thead><tbody>
  ${PREF_EVENTS.map((e,i)=>`<tr><td>${e}</td><td class="num"><input type="checkbox" id="pf-${i}-0" data-pref="${i}:0" ${prefs[i][0]?'checked':''} aria-label="${e} uygulama içi"></td><td class="num"><input type="checkbox" id="pf-${i}-1" data-pref="${i}:1" ${prefs[i][1]?'checked':''} aria-label="${e} e-posta"></td></tr>`).join('')}</tbody></table></div><p class="hint">Teams ve Slack entegrasyonu sonraki sürümde.</p></section></div>`;
 $('#drawer').hidden=false;$('#scrim').hidden=false;
 $('#markAll').onclick=()=>{list.forEach(n=>n.unread=false);renderShell();openNotifs()};
}

/* ---------- olaylar ---------- */
document.addEventListener('click',e=>{
 const g=(sel)=>e.target.closest(sel);
 let el;
 if(el=g('[data-role]')){role=el.dataset.role;closeDrawer();closeModal();if(!allowedViews().some(v=>v[0]===location.hash.slice(1)))location.hash='ana';boardScope='all';rTeam='';rUnit='';render();toast(`${nm(me())} (${ROLE_LABEL[role]}) olarak görüntülüyorsunuz`);return}
 if(el=g('[data-notif]')){const n=notifs[me()][+el.dataset.notif];n.unread=false;renderShell();if(n.task){openTask(n.task)}else openNotifs();return}
 if(el=g('[data-accept]')){accept(tasks.find(t=>t.id===el.dataset.accept));return}
 if(el=g('[data-refuse]')){openRefuse(tasks.find(t=>t.id===el.dataset.refuse));return}
 if(el=g('[data-return]')){openRefuse(tasks.find(t=>t.id===el.dataset.return),'return');return}
 if(el=g('[data-delegate]')){openDelegate(tasks.find(t=>t.id===el.dataset.delegate));return}
 if(el=g('[data-reassign]')){openNew({reassign:tasks.find(t=>t.id===el.dataset.reassign)});return}
 if(el=g('[data-cancel]')){const t=tasks.find(x=>x.id===el.dataset.cancel);t.status='İptal';log(t,`${nm(me())} iptal etti`);toast(`${t.id} iptal edildi`);refresh(t);return}
 if(el=g('[data-evok]')||g('[data-evno]')){const ok=!!el.dataset.evok;const ev=events.find(x=>x.id===(el.dataset.evok||el.dataset.evno));ev.status=ok?'ok':'no';notify(ev.person,`${ev.title}: ${ok?'onaylandı':'reddedildi'}.`);toast(ok?'Etkinlik onaylandı':'Etkinlik reddedildi');render();return}
 if(el=g('[data-rsvp]')){const[id,v]=el.dataset.rsvp.split(':');events.find(x=>x.id===id).rsvp[me()]=v;toast(v==='yes'?'Katılımınız kaydedildi':'Yanıtınız kaydedildi');render();return}
 if(el=g('[data-open]')){openTask(el.dataset.open);return}
 if(g('[data-mclose]')||e.target===$('#mscrim')||e.target===$('#modalWrap')){closeModal();return}
 if(g('[data-close]')||e.target===$('#scrim')){closeDrawer();return}
 if(el=g('[data-go]')){location.hash=el.dataset.go;return}
 if(el=g('[data-scope]')){boardScope=el.dataset.scope;render();return}
 if(el=g('[data-pri]')){const k=el.dataset.pri;priF.has(k)?priF.delete(k):priF.add(k);render();return}
 if(el=g('[data-demo]')){toast(`${el.dataset.demo}: bu prototipte gösterim amaçlı. Değişiklik denetim izine yazılır.`);return}
});
document.addEventListener('change',e=>{if(e.target.id==='teamF'){teamF=e.target.value;render()}if(e.target.id==='kindF'){kindF=e.target.value;render()}if(e.target.dataset.pref){const[i,c]=e.target.dataset.pref.split(':');prefs[i][c]=e.target.checked;toast('Tercih kaydedildi')}});
$('#q').addEventListener('input',e=>{q=e.target.value.trim().toLocaleLowerCase('tr');if(!['gorevler','ana'].includes(current()))location.hash='gorevler';else render()});
$('#newBtn').onclick=()=>openNew();
$('#bellBtn').onclick=openNotifs;
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(!$('#modalWrap').hidden)closeModal();else if(!$('#drawer').hidden)closeDrawer()}
 if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}
});
window.addEventListener('hashchange',()=>{closeDrawer();render()});
render();
</script>
